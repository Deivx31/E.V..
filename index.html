<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#08090d"
    >

    <meta
        name="description"
        content="E.V. - Tu asistente escolar inteligente"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="E.V."
    >

    <title>E.V. - Asistente Escolar</title>


    <!-- PWA -->

    <link
        rel="manifest"
        href="manifest.json"
    >

    <link
        rel="apple-touch-icon"
        href="icons/icon-192.png"
    >


    <!-- ESTILOS -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<main class="app">


    <!-- ==============================
         ENCABEZADO
    =============================== -->

    <header class="header">

        <div class="logo">
            E.V.
        </div>


        <div
            id="saludo"
            class="saludo"
        >
            Cargando...
        </div>


        <div
            id="fecha"
            class="fecha"
        >
            Cargando...
        </div>

    </header>



    <!-- ==============================
         CLASE ACTUAL
    =============================== -->

    <section class="card principal">

        <div
            id="estadoClase"
            class="estado"
        >
            Cargando...
        </div>


        <div class="clase-numero">

            Clase

            <span id="numeroClase">
                --
            </span>

        </div>


        <h1 id="claseActual">
            Cargando...
        </h1>


        <div
            id="horaClase"
            class="hora"
        >
            --
        </div>


        <div class="barra">

            <div
                id="progreso"
                class="progreso"
            ></div>

        </div>


        <div
            id="siguienteClase"
            class="siguiente"
        >
            Cargando...
        </div>

    </section>



    <!-- ==============================
         HORARIO DE HOY
    =============================== -->

    <section class="seccion">

        <div class="titulo-seccion">

            <h2>
                Horario de hoy
            </h2>


            <button
                type="button"
                onclick="mostrarHorario()"
            >
                Ver todo
            </button>

        </div>


        <div
            id="horarioHoy"
            class="lista"
        ></div>

    </section>



    <!-- ==============================
         TAREAS
    =============================== -->

    <section class="seccion">

        <div class="titulo-seccion">

            <h2>
                Tareas pendientes
            </h2>


            <span
                id="contadorTareas"
                class="contador"
            >
                0
            </span>

        </div>


        <div
            id="tareas"
            class="lista"
        ></div>


        <button
            type="button"
            class="boton-agregar"
            onclick="nuevaTarea()"
        >
            + Agregar tarea
        </button>

    </section>



    <!-- ==============================
         ASISTENTE E.V.
    =============================== -->

    <section
        class="seccion asistente"
        id="seccionEV"
    >

        <div class="titulo-seccion">

            <h2>
                Habla con E.V.
            </h2>

        </div>


        <div class="asistente-box">


            <!-- RESPUESTA -->

            <div
                id="respuestaEV"
                class="respuesta-ev"
            >
                Hola David. Estoy lista para ayudarte.
            </div>



            <!-- ENTRADA -->

            <div class="entrada-ev">


                <input
                    id="entradaTexto"
                    type="text"
                    placeholder="Escribe o habla con E.V..."
                    autocomplete="off"
                    enterkeyhint="send"
                >


                <button
                    type="button"
                    class="boton-enviar"
                    onclick="procesarEntrada()"
                    title="Enviar mensaje"
                >
                    Enviar
                </button>


                <button
                    id="botonEscuchar"
                    type="button"
                    class="microfono"
                    onclick="escuchar()"
                    title="Hablar con E.V."
                    aria-label="Hablar con E.V."
                >
                    Mic
                </button>


            </div>

        </div>

    </section>



    <!-- ==============================
         NAVEGACIÓN
    =============================== -->

    <nav class="nav">


        <button
            type="button"
            onclick="irInicio()"
            class="nav-activo"
        >
            Inicio
        </button>


        <button
            type="button"
            onclick="mostrarHorario()"
        >
            Horario
        </button>


        <button
            type="button"
            onclick="mostrarTareas()"
        >
            Tareas
        </button>


        <button
            type="button"
            onclick="activarEV()"
        >
            E.V.
        </button>


    </nav>


</main>



<!-- ==============================
     PANEL HORARIO
=============================== -->

<div
    id="panelHorario"
    class="panel"
    aria-hidden="true"
>

    <div class="panel-contenido">


        <div class="panel-header">

            <h2>
                Mi horario
            </h2>


            <button
                type="button"
                onclick="cerrarPanel()"
            >
                Cerrar
            </button>

        </div>



        <!-- DÍAS -->

        <div class="dias">


            <button
                type="button"
                onclick="cambiarDia(0)"
            >
                Lunes
            </button>


            <button
                type="button"
                onclick="cambiarDia(1)"
            >
                Martes
            </button>


            <button
                type="button"
                onclick="cambiarDia(2)"
            >
                Miércoles
            </button>


            <button
                type="button"
                onclick="cambiarDia(3)"
            >
                Jueves
            </button>


            <button
                type="button"
                onclick="cambiarDia(4)"
            >
                Viernes
            </button>


        </div>



        <!-- HORARIO -->

        <div
            id="horarioCompleto"
            class="lista"
        ></div>


    </div>

</div>



<!-- ==============================
     PANEL TAREAS
=============================== -->

<div
    id="panelTareas"
    class="panel"
    aria-hidden="true"
>

    <div class="panel-contenido">


        <div class="panel-header">

            <h2>
                Mis tareas
            </h2>


            <button
                type="button"
                onclick="cerrarPanel()"
            >
                Cerrar
            </button>

        </div>



        <!-- FILTROS -->

        <div class="filtro-tareas">


            <button
                id="filtroPendientes"
                type="button"
                class="filtro activo"
                onclick="cambiarFiltroTareas('pendientes')"
            >
                Pendientes
            </button>


            <button
                id="filtroCompletadas"
                type="button"
                class="filtro"
                onclick="cambiarFiltroTareas('completadas')"
            >
                Completadas
            </button>


        </div>



        <!-- LISTA -->

        <div
            id="tareasCompletas"
            class="lista"
        ></div>



        <!-- AGREGAR -->

        <button
            type="button"
            class="boton-agregar"
            onclick="nuevaTarea()"
        >
            + Agregar tarea
        </button>


    </div>

</div>



<!-- ==============================
     SCRIPT PRINCIPAL
=============================== -->

<script src="app.js"></script>


</body>

</html>
